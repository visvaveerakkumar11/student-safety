spring.application.name=child-safety-backend

# Local secrets live in backend/.env (KEY=VALUE, git-ignored). Real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# --- Supabase PostgreSQL (use the Session pooler connection string) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=15000

# Schema is owned by database/schema.sql; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Application ---
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
# Optional shared key that lets physical RFID readers call POST /api/rfid/scan (header X-Reader-Key).
app.security.reader-api-key=${RFID_READER_API_KEY:}

# First admin account, created on startup only when the admins table is empty.
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:School Administrator}

app.rfid.duplicate-scan-window-seconds=${DUPLICATE_SCAN_WINDOW_SECONDS:10}

app.notifications.simulated-failure-rate=${SIM_NOTIFICATION_FAILURE_RATE:0.08}
app.notifications.dispatch-interval-ms=${NOTIFICATION_DISPATCH_INTERVAL_MS:2000}

# Demo only: simulate a card tap every 20 seconds so the dashboard shows live activity.
app.demo.traffic-enabled=${DEMO_TRAFFIC_ENABLED:false}
